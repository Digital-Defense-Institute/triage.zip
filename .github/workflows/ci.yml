name: Parser runtime benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/ecapuano/parser-runtime-benchmark'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test benchmark, collector build helpers, and Windows validator
        run: |
          python3 -B -m unittest discover -s tests -p test_parser_benchmark.py -v
          python3 -B -m unittest discover -s tests -p test_collector_common.py -v
          python3 -B -m unittest discover -s tests -p 'test_windows*.py' -v
      - name: Build original production collectors
        run: bash build_collector.sh
      - name: Build parser-only variant from the same inputs
        run: |
          set -euo pipefail
          python3 scripts/prepare_parser_benchmark.py
          ./velociraptor collector --datastore ./datastore/ ./config/spec_benchmark_parsers.yaml
          source lib/collector_common.sh
          verify_collector_not_stub ./datastore/Velociraptor_Triage_Collector_Parsers.exe
          mkdir benchmark-inputs
          cp datastore/Velociraptor_Triage_Collector.exe benchmark-inputs/baseline.exe
          cp datastore/Velociraptor_Triage_Collector_Parsers.exe benchmark-inputs/parsers.exe
          cp data/velociraptor-version.json benchmark-inputs/metadata.json
          cd benchmark-inputs
          sha256sum baseline.exe parsers.exe > SHA256SUMS
      - name: Upload only benchmark executables and public metadata
        id: package
        uses: actions/upload-artifact@v4
        with:
          name: parser-benchmark-inputs
          path: benchmark-inputs/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  benchmark:
    name: fresh-${{ matrix.variant }}-${{ matrix.repeat }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, parsers]
        repeat: [1, 2, 3]
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      BENCHMARK_REPEAT: ${{ matrix.repeat }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test guarded Windows runner helpers
        run: python -B -m unittest discover -s tests -p 'test_windows*.py' -v
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: benchmark-inputs
          merge-multiple: true
      - name: Run first production collection on fresh runner
        shell: pwsh
        run: ./scripts/run_parser_benchmark.ps1 -Variant '${{ matrix.variant }}'
      - name: Retain numeric reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-runtime-report-${{ matrix.variant }}-${{ matrix.repeat }}
          path: parser-benchmark-report/
          if-no-files-found: warn
          retention-days: 3
